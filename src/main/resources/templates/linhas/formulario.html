<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Linha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-body p-4">
            <h3 class="mb-4" th:text="${linha.id == null ? 'Nova Linha' : 'Editar Linha'}"></h3>
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/web/linhas/salvar}" th:object="${linha}" method="post" novalidate>
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" th:field="*{codigo}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" th:field="*{nome}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Extensão (km)</label>
                    <input type="number" step="0.01" th:field="*{extensaoKm}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('extensaoKm')}" th:errors="*{extensaoKm}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Modal</label>
                    <select th:field="*{modal}" class="form-select" required>
                        <option th:each="m : ${modais}" th:value="${m}" th:text="${m}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('modal')}" th:errors="*{modal}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cidade</label>
                    <select th:field="*{cidade}" class="form-select" required>
                        <option th:each="c : ${cidades}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>
                </div>
                <div class="form-check mb-4">
                    <input type="checkbox" th:field="*{estaAtiva}" class="form-check-input" id="ativaCheck">
                    <label class="form-check-label" for="ativaCheck">Linha Ativa</label>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/web/linhas}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>

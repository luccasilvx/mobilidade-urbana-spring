<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Linhas - Mobilidade Urbana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/web/linhas}">Mobilidade Urbana</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" th:href="@{/web/linhas}">Linhas</a>
            <a class="nav-link" th:href="@{/web/viagens}">Viagens</a>
        </div>
        <div class="d-flex align-items-center gap-3 text-white">
            <span>Usuário: <strong sec:authentication="name"></strong></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Linhas Cadastradas</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/web/linhas/nova}" class="btn btn-success">+ Nova Linha</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>Cidade</th>
                <th>Modal</th>
                <th>Extensão (km)</th>
                <th>Ativa</th>
                <th sec:authorize="hasRole('ADMIN')">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="linha : ${linhas}">
                <td th:text="${linha.codigo}"></td>
                <td th:text="${linha.nome}"></td>
                <td th:text="${linha.cidade != null ? linha.cidade.nome : '-'}"></td>
                <td th:text="${linha.modal}"></td>
                <td th:text="${linha.extensaoKm}"></td>
                <td>
                        <span th:text="${linha.estaAtiva ? 'Sim' : 'Não'}"
                              th:classappend="${linha.estaAtiva ? 'badge bg-success' : 'badge bg-secondary'}"></span>
                </td>
                <td sec:authorize="hasRole('ADMIN')" class="d-flex gap-2">
                    <a th:href="@{/web/linhas/editar/{id}(id=${linha.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <form th:action="@{/web/linhas/excluir/{id}(id=${linha.id})}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro - Mobilidade Urbana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container text-center">
    <div class="card shadow-sm mx-auto p-4" style="max-width: 480px;">
        <h4 class="text-danger mb-3" th:text="${titulo}">Erro</h4>
        <p class="text-muted" th:text="${mensagem}">Ocorreu um erro inesperado.</p>
        <a th:href="@{/web/linhas}" class="btn btn-primary">Voltar ao Sistema</a>
    </div>
</div>
</body>
</html>
